apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dealership
resources:
  - namespace.yaml
  - configmap.yaml
  - mongodb.yaml
  - dealer-api.yaml
  - sentiment.yaml
  - web.yaml
secretGenerator:
  - name: dealership-secrets
    envs:
      - secrets.env
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: dealership-web
    newTag: dev
  - name: dealer-api
    newTag: dev
  - name: sentiment
    newTag: dev
