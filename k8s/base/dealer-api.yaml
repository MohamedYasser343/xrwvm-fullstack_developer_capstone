apiVersion: v1
kind: Service
metadata:
  name: dealer-api
spec:
  selector:
    app.kubernetes.io/name: dealer-api
  ports:
    - name: http
      port: 3030
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealer-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dealer-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dealer-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: dealer-api
          image: dealer-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_URL
              valueFrom:
                configMapKeyRef:
                  name: dealership-config
                  key: MONGO_URL
          ports:
            - name: http
              containerPort: 3030
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
