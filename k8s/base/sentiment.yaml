apiVersion: v1
kind: Service
metadata:
  name: sentiment
spec:
  selector:
    app.kubernetes.io/name: sentiment
  ports:
    - name: http
      port: 5050
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentiment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentiment
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: sentiment
          image: sentiment:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5050
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
