<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home | Best Cars</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script>
      const logout = async () => {
        // Authentication is implemented in the next capstone module.
      };

      const checkSession = () => {
        const currentUser = sessionStorage.getItem("username");
        const sessionLinks = document.getElementById("loginlogout");

        if (currentUser) {
          sessionLinks.innerHTML =
            '<span class="homepage_links">' + currentUser + '</span>' +
            '<a class="homepage_links" onclick="logout()" href="/">Logout</a>';
        } else {
          sessionLinks.innerHTML =
            '<a class="homepage_links" href="/login">Login</a>' +
            '<a class="homepage_links" href="/register">Register</a>';
        }
      };
    </script>
  </head>
  <body onload="checkSession()">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">Best Cars</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavigation" aria-controls="mainNavigation"
                aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
            <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
          </ul>
          <div class="navbar-text loginlink" id="loginlogout"></div>
        </div>
      </div>
    </nav>

    <main class="page-shell">
      <div class="container">
        <section class="hero-card card overflow-hidden mx-auto">
          <img src="/static/car_dealership.jpg" class="hero-image card-img-top" alt="Best Cars dealership showroom">
          <div class="card-body p-4 p-md-5 text-center">
            <h1 class="display-5 fw-bold">Welcome to Best Cars</h1>
            <p class="lead">Find trusted dealerships and learn from real customer experiences across the country.</p>
            <a href="/dealers" class="btn btn-primary btn-lg">View Dealerships</a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
